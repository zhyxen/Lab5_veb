<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагування спеціаліста — USVIDOM</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <a href="index.html">Каталог</a>
            <a href="about.html">Про проєкт</a>
            <a href="admin.html">Адміністрування</a>
        </nav>
    </header>

    <main class="site-main">
        <h2>Форма редагування спеціаліста</h2>
        <form class="form">
            <input type="hidden" name="itemId" value="1">
            
            <div class="form__field-group">
                <label class="form__label" for="edit-title">ПІБ / Назва спеціаліста:</label>
                <input class="form__input" type="text" id="edit-title" name="title" value="Олена Коваль" required>
            </div>

            <div class="form__field-group">
                <label class="form__label" for="edit-price">Вартість сесії (грн):</label>
                <input class="form__input" type="number" id="edit-price" name="price" value="1500" min="800" max="3000" step="100" required>
            </div>

            <div class="form__actions">
                <button class="button button--primary" type="submit">Зберегти зміни</button>
                <a class="button button--secondary" href="admin.html">Скасувати зміни</a>
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Студія USVIDOM</p>
    </footer>
</body>
</html>
